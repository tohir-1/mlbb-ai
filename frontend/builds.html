<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buildlar — MLBB AI UZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><a href="admin.html" class="logo" title="Admin Panel">MLBB AI <span>UZ</span></a></div>
      <nav class="nav">
        <a href="index.html" class="nav-link">Bosh sahifa</a>
        <a href="ai-chat.html" class="nav-link">AI Chat</a>
        <a href="heroes.html" class="nav-link">Herolar</a>
        <a href="builds.html" class="nav-link active">Buildlar</a>
        <a href="meta.html" class="nav-link">META</a>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-toggle"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <div style="font-weight:600">Buildlar</div>
        <div class="topbar-actions"><div class="auth-area"></div></div>
      </header>
      <main class="content">
        <h1 class="section-title">Tavsiya etilgan buildlar</h1>
        <p class="section-sub">Patch versiyasi bilan bog'langan. AI dan individual build so'rang.</p>
        <div class="grid grid-2" id="list"></div>
      </main>
    </div>
  </div>
  <script src="js/admin-store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    apiClient.getBuilds().then(({ builds }) => {
      document.getElementById('list').innerHTML = builds.map(b => `
        <div class="card">
          <h3>${escapeHtml(b.name)}</h3>
          <p class="text-muted">${b.hero ? escapeHtml(b.hero.name) : ''} · ${escapeHtml(b.type)}</p>
          <p class="mt-1">${escapeHtml(b.description || '')}</p>
          <p class="text-muted mt-1" style="font-size:0.85rem">Emblem: ${escapeHtml(b.emblem || '-')} · Spell: ${escapeHtml(b.battleSpell || '-')}</p>
          ${b.itemDetails && b.itemDetails.length ? `<div class="mt-1 flex gap-1" style="flex-wrap:wrap">${b.itemDetails.map(i => `<span class="badge badge-primary">${escapeHtml(i.name)}</span>`).join('')}</div>` : ''}
        </div>
      `).join('') || '<p class="text-muted">Buildlar yo\'q</p>';
    }).catch(e => document.getElementById('list').innerHTML = '<p>' + e.message + '</p>');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero — MLBB AI UZ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .item-row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; align-items: flex-start; }
    .item-chip {
      display: flex; flex-direction: column; align-items: center; gap: 0.35rem;
      width: 78px; text-align: center;
    }
    .item-chip img {
      width: 56px; height: 56px; border-radius: 10px;
      border: 2px solid rgba(139,92,246,0.4);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35), 0 0 12px rgba(139,92,246,0.2);
      object-fit: cover; background: #151D2E;
    }
    .item-chip span { font-size: 0.68rem; color: var(--muted); line-height: 1.25; }
    .emblem-box, .spell-box {
      display: inline-flex; align-items: center; gap: 0.75rem;
      border-radius: 12px; padding: 0.65rem 1rem; margin-top: 0.5rem;
    }
    .emblem-box {
      background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.35);
    }
    .spell-box {
      background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.35); margin-left: 0.5rem;
    }
    .emblem-box img, .spell-box img {
      width: 48px; height: 48px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 12px rgba(139,92,246,0.3);
    }
    .spell-box img { border-radius: 10px; width: 40px; height: 40px; }
    .build-card { margin-bottom: 1.25rem; }
    .build-order { font-size: 0.75rem; color: var(--muted); margin-top: 0.6rem; }
    .hero-portrait {
      width: 110px; height: 110px; border-radius: 18px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; font-weight: 800; color: #fff;
      box-shadow: 0 8px 24px rgba(139,92,246,0.35);
      border: 2px solid rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header"><a href="admin.html" class="logo" title="Admin Panel">MLBB AI <span>UZ</span></a></div>
      <nav class="nav">
        <div class="nav-section">
          <a href="index.html" class="nav-link">Bosh sahifa</a>
          <a href="ai-chat.html" class="nav-link">AI Chat</a>
          <a href="heroes.html" class="nav-link active">Herolar</a>
          <a href="builds.html" class="nav-link">Buildlar</a>
          <a href="meta.html" class="nav-link">META</a>
          <a href="settings.html" class="nav-link">Settings</a>
        </div>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button class="menu-toggle"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <a href="heroes.html" class="text-muted" style="font-size:0.9rem">← Herolar</a>
        <div class="topbar-actions"><div class="auth-area"></div></div>
      </header>
      <main class="content" id="content">
        <div class="card skeleton" style="height:200px"></div>
      </main>
    </div>
  </div>
  <script src="js/admin-store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Item nomi → rasm fayli
    const ITEM_IMG = {
      "Blade of Despair": "blade-of-despair.svg",
      "Endless Battle": "endless-battle.svg",
      "Hunter Strike": "hunter-strike.svg",
      "Berserker's Fury": "berserkers-fury.svg",
      "Scarlet Phantom": "scarlet-phantom.svg",
      "Windtalker": "windtalker.svg",
      "Divine Glaive": "divine-glaive.svg",
      "Lightning Truncheon": "lightning-truncheon.svg",
      "Holy Crystal": "holy-crystal.svg",
      "Genius Wand": "genius-wand.svg",
      "Athena's Shield": "athenas-shield.svg",
      "Immortality": "immortality.svg",
      "Dominance Ice": "dominance-ice.svg",
      "Antique Cuirass": "antique-cuirass.svg",
      "Oracle": "oracle.svg",
      "Winter Truncheon": "winter-truncheon.svg",
      "Tough Boots": "tough-boots.svg",
      "Warrior Boots": "warrior-boots.svg",
      "Arcane Boots": "arcane-boots.svg",
      "Swift Boots": "swift-boots.svg",
      "Rapid Boots": "rapid-boots.svg",
      "Magic Shoes": "magic-shoes.svg"
    };
    const SPELL_IMG = {
      "Execute": "execute.svg",
      "Inspire": "inspire.svg",
      "Flicker": "flicker.svg",
      "Retribution": "retribution.svg",
      "Purify": "purify.svg"
    };
    const EMBLEM_IMG = {
      "Assassin Emblem": "assassin.svg",
      "Mage Emblem": "mage.svg",
      "Marksman Emblem": "marksman.svg",
      "Tank Emblem": "tank.svg",
      "Support Emblem": "support.svg",
      "Fighter Emblem": "fighter.svg"
    };

    function itemImg(name) {
      const file = ITEM_IMG[name];
      if (file) return 'assets/items/' + file;
      return null;
    }
    function emblemImg(name) {
      const file = EMBLEM_IMG[name];
      return file ? 'assets/emblems/' + file : 'assets/emblems/fighter.svg';
    }
    function spellImg(name) {
      const file = SPELL_IMG[name];
      return file ? 'assets/items/' + file : null;
    }

    const DEFAULT_BUILDS = {
      Assassin: {
        name: 'Assassin Best Build',
        emblem: 'Assassin Emblem',
        emblemTalent: 'Invasion / Killing Spree',
        battleSpell: 'Execute',
        items: ['Warrior Boots', 'Hunter Strike', 'Blade of Despair', 'Endless Battle', "Berserker's Fury", 'Immortality'],
        description: 'Yuqori burst. Hunter Strike → Blade of Despair.'
      },
      Marksman: {
        name: 'Marksman Best Build',
        emblem: 'Marksman Emblem',
        emblemTalent: 'Weakness Finder / Weapon Master',
        battleSpell: 'Inspire',
        items: ['Swift Boots', 'Scarlet Phantom', "Berserker's Fury", 'Windtalker', 'Blade of Despair', 'Immortality'],
        description: 'Attack speed + crit. Late game DPS.'
      },
      Mage: {
        name: 'Mage Best Build',
        emblem: 'Mage Emblem',
        emblemTalent: 'Lethal Ignition / Festival of Blood',
        battleSpell: 'Flicker',
        items: ['Arcane Boots', 'Lightning Truncheon', 'Divine Glaive', 'Holy Crystal', 'Genius Wand', 'Winter Truncheon'],
        description: 'Magic power + penetration.'
      },
      Tank: {
        name: 'Tank Best Build',
        emblem: 'Tank Emblem',
        emblemTalent: 'Vitality / Concussive Blast',
        battleSpell: 'Flicker',
        items: ['Tough Boots', 'Dominance Ice', "Athena's Shield", 'Antique Cuirass', 'Immortality', 'Oracle'],
        description: 'Defense + CC. Engage va peel.'
      },
      Support: {
        name: 'Support Best Build',
        emblem: 'Support Emblem',
        emblemTalent: 'Favor / Focusing Mark',
        battleSpell: 'Flicker',
        items: ['Tough Boots', 'Dominance Ice', "Athena's Shield", 'Oracle', 'Immortality', 'Antique Cuirass'],
        description: 'Utility va himoya.'
      },
      Fighter: {
        name: 'Fighter Best Build',
        emblem: 'Fighter Emblem',
        emblemTalent: 'Festival of Blood / Brave Smite',
        battleSpell: 'Execute',
        items: ['Warrior Boots', 'Hunter Strike', 'Endless Battle', 'Blade of Despair', 'Oracle', 'Immortality'],
        description: 'Hybrid damage + sustain.'
      }
    };

    function renderBuild(b) {
      const items = b.items || [];
      const itemHtml = items.map(name => {
        const src = itemImg(name);
        const img = src
          ? `<img src="${src}" alt="${escapeHtml(name)}" />`
          : `<div style="width:56px;height:56px;border-radius:10px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.7rem;color:#fff">${escapeHtml((name||'?').slice(0,2))}</div>`;
        return `<div class="item-chip">${img}<span>${escapeHtml(name)}</span></div>`;
      }).join('');

      const eSrc = emblemImg(b.emblem || '');
      const sSrc = spellImg(b.battleSpell || '');

      return `
        <div class="card build-card">
          <h3 style="margin-bottom:0.25rem">${escapeHtml(b.name || 'Best Build')}</h3>
          <p class="text-muted" style="font-size:0.85rem">${escapeHtml(b.description || '')}</p>
          <div style="display:flex;flex-wrap:wrap;align-items:center;gap:0.25rem;margin-top:0.75rem">
            <div class="emblem-box">
              <img src="${eSrc}" alt="Emblem" />
              <div>
                <div style="font-weight:600;font-size:0.9rem">${escapeHtml(b.emblem || 'Emblem')}</div>
                <div class="text-muted" style="font-size:0.75rem">${escapeHtml(b.emblemTalent || 'Talent tanlang')}</div>
              </div>
            </div>
            <div class="spell-box">
              ${sSrc ? `<img src="${sSrc}" alt="Spell" />` : ''}
              <div style="font-weight:600;font-size:0.85rem">${escapeHtml(b.battleSpell || 'Spell')}</div>
            </div>
          </div>
          <div style="margin-top:1rem">
            <div style="font-size:0.8rem;font-weight:600;color:var(--muted);margin-bottom:0.4rem">ITEM BUILD (tartib bo'yicha)</div>
            <div class="item-row">${itemHtml}</div>
          </div>
          <p class="build-order">1 → 2 → 3 → 4 → 5 → 6 &nbsp;|&nbsp; Boots birinchi yoki ikkinchi</p>
        </div>
      `;
    }

    const id = new URLSearchParams(location.search).get('id');
    async function load() {
      if (!id) { document.getElementById('content').innerHTML = '<p>Hero ID yo\'q</p>'; return; }
      try {
        const h = await apiClient.getHero(id);
        document.title = h.name + ' — MLBB AI UZ';

        let builds = h.builds && h.builds.length ? h.builds : [];
        if (!builds.length && h.role && DEFAULT_BUILDS[h.role]) {
          builds = [{ ...DEFAULT_BUILDS[h.role], heroId: h.id }];
        }

        const buildsHtml = builds.length
          ? `<h2 class="section-title mt-3">Eng yaxshi build</h2>${builds.map(renderBuild).join('')}`
          : '';

        document.getElementById('content').innerHTML = `
          <div class="flex gap-3 mb-3" style="align-items:flex-start;flex-wrap:wrap">
            <div class="hero-portrait">${h.name.slice(0,2)}</div>
            <div>
              <h1 class="section-title" style="margin:0">${escapeHtml(h.name)}</h1>
              <div class="flex gap-1 mt-1">${roleBadge(h.role)} ${h.tier ? tierBadge(h.tier) : ''} <span class="badge badge-primary">${h.lane || '-'}</span></div>
              <p class="text-muted mt-1">${escapeHtml(h.specialty || '')} · Difficulty: ${'★'.repeat(h.difficulty||1)}${'☆'.repeat(3-(h.difficulty||1))}</p>
            </div>
          </div>
          <div class="card mb-2"><p>${escapeHtml(h.description || '')}</p></div>
          <div class="grid grid-2 mb-2">
            <div class="card"><h3 class="mb-1">Passive — ${escapeHtml(h.passive_name||'')}</h3><p class="text-muted">${escapeHtml(h.passive_desc||'')}</p></div>
            <div class="card"><h3 class="mb-1">Skill 1 — ${escapeHtml(h.skill1_name||'')}</h3><p class="text-muted">${escapeHtml(h.skill1_desc||'')}</p></div>
            <div class="card"><h3 class="mb-1">Skill 2 — ${escapeHtml(h.skill2_name||'')}</h3><p class="text-muted">${escapeHtml(h.skill2_desc||'')}</p></div>
            <div class="card"><h3 class="mb-1">Ultimate — ${escapeHtml(h.ultimate_name||'')}</h3><p class="text-muted">${escapeHtml(h.ultimate_desc||'')}</p></div>
          </div>
          ${buildsHtml}
          ${h.counters && h.counters.length ? `<h2 class="section-title mt-3">Counterlar</h2>
            <div class="grid grid-auto">${h.counters.map(c => c.counterHero ? `
              <a href="hero-details.html?id=${c.counterHero.id}" class="card hero-card">
                <div class="avatar">${c.counterHero.name.slice(0,2)}</div>
                <h3>${escapeHtml(c.counterHero.name)}</h3>
                <p class="text-muted" style="font-size:0.8rem">${escapeHtml(c.reason||'')}</p>
              </a>` : '').join('')}</div>` : ''}
          <div class="mt-3"><a href="ai-chat.html?q=${encodeURIComponent(h.name + ' eng yaxshi build va emblem')}" class="btn btn-primary">AI dan so'rash</a></div>
        `;
      } catch (e) {
        document.getElementById('content').innerHTML = '<p class="text-muted">' + e.message + '</p>';
      }
    }
    load();
  </script>
</body>
</html>
